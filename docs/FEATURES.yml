# The feature catalog (issue #62): the single, deterministic list of what this project does, which suite steps prove each feature,
# which files touch it, and which docs and diagrams describe it. `make regression` runs the suites in the order below and writes the
# feature x result table into docs/POC-STATUS.md; tests/test_features.py fails when a Makefile suite is missing here, a feature names
# no suite step, or a step, path, doc or diagram does not exist. Change the catalog in the same PR that changes a suite or a feature.
#
# suites:   one entry per `poc-*` target of the Makefile, in the order `make regression` runs them (cheap and offline first).
#   runtime: where the suite can run: none (no machines), docker, incus, kind. Two values: make regression picks one, or runs both with
#   REGRESSION_RUNTIME=docker-vm (the docker and kind suites in an Incus VM of the run).
#   on_game_of: the suite builds nothing and checks the game another suite leaves up (make regression runs that one with KEEP=1).
#   role: teardown: a target that proves nothing by itself (it removes); make regression runs it last.
# features: steps are ids from the suite's source (`step <id>`, `check <rule> <id>`); `A-B` is every step from A to B in source order.
#   runtime: on a suite that runs on docker and incus, each proof names one, and both are listed: a run on one runtime leaves the other's
#   code paths (poc/up.sh or poc/vm/up.sh, the branches of lib.sh) unproved, so the feature shows PARTIAL until both ran.
#   game: on a suite that checks a game (poc-golden), the game the proof needs (aws: the stranger's control plane of DEMO-AWS.md, run by
#   hand); make regression checks its own game, so the table says NOT RUN(aws). A change there cites `- `demo-aws`: PASS` of that run.
#   layer / user_facing / releases / learn (issue #77, "learn mode"): layer is one of scripts/features.py LAYERS (the tables of docs/LEARN.md); user_facing is
#   true when a player, a visitor or the host sees or does it in the demo (a command, a page, a refusal) and is declared on every feature;
#   releases lists the What's new pages that show the feature; learn = {concept, analogy, real_world, seen_in}, one true sentence each, and is
#   REQUIRED when user_facing is true or releases is not empty. docs/LEARN.md and poc/page/whatsnew/learn.json are generated from here
#   (scripts/learn.py write) and sealed with the hash of this data: change the catalog, never those files.
#   paths: globs of tracked files that change the feature; components: the pieces it relies on (the feature graph's last column).
meta:
  tipo: catalogo
  id: k8s-lan-party-features
  version: 0.2.0
  fecha_alta: 2026-11-03
  fecha_ultimo_cambio: 2026-11-04
  categoria: plataforma
  dueno_agente: casa-orquestador
  pieza: k8s-lan-party
  meta: ../meta.yml
  depende_de: [Makefile, poc/README.md]
  lo_usan: [poc/regression.sh, scripts/features.py, tests/test_features.py, docs/POC-STATUS.md]
  docs: [docs/POC-STATUS.md, CONTRIBUTING.md]
  scripts: [scripts/features.py, poc/regression.sh]
  runbooks: []
  tags: [features, regression, tests, catalogo]

# The cluster: the files that build or run a game. A PR that changes one of them proves the whole stack: its Evidence carries the table of
# `make regression` (no FAIL row), or every feature it touches with PASS (scripts/check_pr.py, CONTRIBUTING.md). Suites, tests and docs are
# not here: a change to them needs the RESULT PASS of the suites of the features it touches.
cluster_paths: [poc/lib.sh, poc/pool-lease.sh, poc/up.sh, poc/down.sh, poc/vm/up.sh, poc/vm/lib-vm.sh, poc/vm/down.sh, poc/issue.sh, poc/revoke.sh, poc/cilium.sh,
  poc/gateway.sh, poc/install-placement.sh, poc/lighthouse-vps.sh, poc/spire-args.sh, poc/game-env.sh, poc/edge-mesh, poc/mesh, poc/kc,
  poc/stack.env, poc/*.yaml, poc/placement/*, poc/gateway/*, poc/admission.py, poc/pool.py, poc/nodes_sweep.py, poc/node_password.py,
  poc/participant.py, poc/participants.py, poc/party.py, poc/page/*, examples/aws/*.tf, examples/aws/*.tftpl, examples/aws/leftovers.sh]

suites:
  - {id: poc-participants, script: poc/poc-participants.sh, runtime: [none]}
  - {id: poc-cilium, script: poc/poc-cilium.sh, runtime: [docker]}
  - {id: poc-kind, script: poc/kind-cilium.sh, runtime: [kind]}
  - {id: poc-join, script: poc/poc-join.sh, runtime: [docker, incus]}
  - {id: poc-host, script: poc/poc-host.sh, runtime: [docker, incus]}
  - {id: poc-weakness, script: poc/poc-weakness.sh, runtime: [docker, incus]}
  - {id: poc-ca, script: poc/poc-ca.sh, runtime: [docker, incus]}
  - {id: poc-revoke, script: poc/poc-revoke.sh, runtime: [docker, incus]}
  - {id: poc-placement, script: poc/poc-placement.sh, runtime: [docker, incus]}
  - {id: poc-lighthouse, script: poc/poc-lighthouse.sh, runtime: [incus]}
  - {id: poc-admission, script: poc/poc-admission.sh, runtime: [incus]}
  - {id: poc-admission-auto, script: poc/poc-admission-auto.sh, runtime: [incus]}
  - {id: poc-pool, script: poc/poc-pool.sh, runtime: [incus]}
  - {id: poc-party, script: poc/poc-party.sh, runtime: [incus]}
  - {id: poc-doom, script: poc/poc-doom.sh, runtime: [incus]}
  - {id: poc-participants-e2e, script: poc/poc-participants-e2e.sh, runtime: [incus]}
  - {id: poc-page, script: poc/poc-page.sh, runtime: [incus]}
  - {id: poc-nat, script: poc/poc-nat.sh, runtime: [incus]}
  - {id: poc-bgp, script: poc/vm/poc-bgp.sh, runtime: [incus]}
  - {id: poc-vm, script: poc/vm/poc-vm.sh, runtime: [incus]}
  - {id: poc-golden, script: poc/poc-golden.sh, runtime: [incus], on_game_of: poc-vm}
  - {id: poc-down, script: poc/down.sh, runtime: [docker, incus], role: teardown}

features:
  - id: join
    description: one bundle and one command join a machine to the game over Nebula; the node is Ready on its Nebula IP; clear failures
    layer: mesh
    user_facing: true
    releases: ["v0.2.0-poc"]
    learn:
      concept: "Overlay mesh (Nebula) and remote node join: a machine on any network becomes a Kubernetes node over an encrypted tunnel."
      analogy: "You plug your PC into the host's LAN with one cable and one password, from wherever you are."
      real_world: "Branch offices, rented GPUs and hybrid home and cloud nodes that join a cluster even behind NAT."
      seen_in: "v0.2.0-poc: an AWS machine follows JOIN.md, joins and is Ready in 2 min 30 s."
    proven_by:
      - {suite: poc-join, runtime: docker, steps: [J01-J07, J15-J16]}
      - {suite: poc-join, runtime: incus, steps: [J01-J07, J15-J16]}
      - {suite: poc-vm, steps: [V01, V04]}
    paths: [poc/edge-mesh, poc/up.sh, poc/vm/up.sh, poc/vm/lib-vm.sh, poc/lib.sh, poc/issue.sh, poc/stack.env, poc/pool-lease.sh]
    components: [Nebula, k3s, edge-mesh]
    docs: [docs/JOIN.md, docs/REQUIREMENTS.md, docs/TROUBLESHOOTING.md]
    diagrams: [docs/diagrams/layers-endpoints-join.mmd]

  - id: study-lab
    description: a real study lab (CKA 1.1) breaks, verifies and is fixed on the joined outside nodes, never on the control plane
    layer: tenancy
    user_facing: true
    learn:
      concept: "Practice on real nodes: a lab breaks, is verified and is fixed on the joined machines, never on the control plane."
      analogy: "A practice room where the exam question is a real machine that is really broken."
      real_world: "Certification drills and onboarding exercises on disposable nodes instead of a shared production cluster."
      seen_in: "The CKA 1.1 lab on the joined outside nodes (poc-join, J09 to J12)."
    proven_by:
      - {suite: poc-join, runtime: docker, steps: [J09-J12]}
      - {suite: poc-join, runtime: incus, steps: [J09-J12]}
    paths: [poc/labs/*, poc/poc-join.sh]
    components: [k3s, study lab]
    docs: [poc/README.md, README.md]

  - id: host-your-own
    description: mesh host init, invite with a TTL, play, players and kick; the API answers on the Nebula IP only
    layer: mesh
    user_facing: true
    learn:
      concept: "A self-hosted control plane with bounded invitations: an invite expires, and the API listens on the mesh address only."
      analogy: "You host a game server, hand out invites that run out, and the server is not on the public internet."
      real_world: "A platform team opening a cluster to contractors or partner teams, by invitation and for a limited time."
      seen_in: "The host's terminal: mesh host init, an invite with a TTL, the players list and kick."
    proven_by:
      - {suite: poc-host, runtime: docker, steps: [H01-H09c]}
      - {suite: poc-host, runtime: incus, steps: [H01-H09c]}
    paths: [poc/mesh, poc/game-env.sh, poc/kc, poc/lib.sh, poc/issue.sh]
    components: [Nebula, k3s, mesh]
    docs: [docs/HOST-YOUR-OWN.md, docs/TRY-IT.md]

  - id: api-members-only
    description: the Kubernetes API listens on the control plane's Nebula IP only; outside the mesh, and from the lighthouse, it does not answer
    layer: mesh
    user_facing: false
    proven_by:
      - {suite: poc-host, runtime: docker, steps: [H02, H02b]}
      - {suite: poc-host, runtime: incus, steps: [H02, H02b]}
      - {suite: poc-golden, steps: [G6.1-G6.2]}
    paths: [poc/up.sh, poc/vm/lib-vm.sh, poc/issue.sh]
    components: [k3s, Nebula]
    docs: [docs/NETWORKING.md, docs/GOLDEN-RULES.md]
    diagrams: [docs/diagrams/who-sees-what.mmd]

  - id: nebula-firewall
    description: the narrowed Nebula firewall lets ICMP, 6443 and the documented ports through and refuses any other port between hosts
    layer: mesh
    user_facing: false
    proven_by:
      - {suite: poc-join, runtime: docker, steps: [J13]}
      - {suite: poc-join, runtime: incus, steps: [J13]}
      - {suite: poc-cilium, steps: [C13-C14]}
      - {suite: poc-vm, steps: [V14-V15]}
    paths: [poc/issue.sh, poc/checks-cilium.sh]
    components: [Nebula]
    docs: [docs/NETWORKING.md]

  - id: mtu-once
    description: the MTU is set once (Nebula); the pod MTU is derived from it and a full-size packet crosses (issue #8)
    layer: mesh
    user_facing: false
    proven_by:
      - {suite: poc-join, runtime: docker, steps: [J08]}
      - {suite: poc-join, runtime: incus, steps: [J08]}
      - {suite: poc-cilium, steps: [C10-C11]}
      - {suite: poc-kind, steps: [K10-K11]}
      - {suite: poc-vm, steps: [V11-V12]}
    paths: [poc/stack.env, poc/cilium.sh, poc/checks-cilium.sh]
    components: [Nebula, Cilium]
    docs: [docs/NETWORKING.md]

  - id: join-token-burn
    description: every player has its own join token; it lives 8 minutes at most and is burned once the node registered
    layer: admission
    user_facing: false
    proven_by:
      - {suite: poc-join, runtime: docker, steps: [J14]}
      - {suite: poc-join, runtime: incus, steps: [J14]}
      - {suite: poc-admission, steps: [A09, A11-A13]}
      - {suite: poc-admission-auto, steps: [AA15, AA23-AA24]}
      - {suite: poc-golden, steps: [G4.1-G4.3]}
    paths: [poc/lib.sh, poc/issue.sh, poc/mesh]
    components: [k3s]
    docs: [docs/ADMISSION.md, docs/GOLDEN-RULES.md]

  - id: node-guard
    description: a copy of a bundle on another machine, or another guest's name, is refused by the node guard and the node password
    layer: admission
    user_facing: true
    learn:
      concept: "Node identity binding: a join bundle and its node password only work for the machine and the name they were issued for."
      analogy: "A ticket with your name on it: a photocopy shown at another door is refused."
      real_world: "Stopping a copied or stolen bootstrap credential from enrolling a second machine in a cluster."
      seen_in: "A copy of a bundle on another machine, or another guest's name, is refused (poc-admission A15 to A18)."
    proven_by:
      - {suite: poc-admission, steps: [A15-A18, A30]}
      - {suite: poc-admission-auto, steps: [AA13, AA20]}
    paths: [poc/node-guard.yaml, poc/node_password.py, poc/nodes_sweep.py, poc/lib.sh]
    components: [k3s, admission policy]
    docs: [docs/ADMISSION.md, docs/DESIGN.md]

  - id: admission-manual
    description: people ask for a place, the host approves one at a time within pool.yaml; the lease ends, reap expels, the next one enters
    layer: admission
    user_facing: true
    learn:
      concept: "Admission control for a limited pool: people request, the host approves within a quota, leases end, the next in line enters."
      analogy: "A venue with a fixed number of seats, a door person and a waiting list."
      real_world: "Scarce shared capacity such as GPU nodes or partner access, handed out in turn."
      seen_in: "The host approves one request at a time; when the lease ends, the next one enters (poc-admission)."
    proven_by:
      - {suite: poc-admission, steps: [A01-A08, A10, A14, A19-A29, A31]}
    paths: [poc/admission.py, poc/pool.yaml, poc/mesh]
    components: [admission, Nebula, k3s]
    docs: [docs/ADMISSION.md]

  - id: admission-auto
    description: the automatic pool (phase B1) approves, warns, expels at the lease end and promotes; auto off, daily cap, panic, notify, metrics
    layer: admission
    user_facing: true
    releases: ["v0.2.0-poc"]
    learn:
      concept: "Automated admission with leases: a rule approves and the access expires by itself, so nobody keeps standing access."
      analogy: "A locker with a timer: you get a key, and it stops working when the hour is over."
      real_world: "Edge nodes, partners and ephemeral CI runners that get access just in time and lose it with no one to remember."
      seen_in: "v0.2.0-poc: a stranger asks on the page, is approved in 55 s and is expelled at the end of its 1 h lease."
    proven_by:
      - {suite: poc-admission-auto, steps: [AA01-AA12, AA14, AA16-AA19, AA21-AA22, AA25-AA37]}
    paths: [poc/admission.py, poc/pool.yaml, poc/mesh]
    components: [admission, Nebula, k3s]
    docs: [docs/ADMISSION.md]

  - id: pool
    description: a namespace and a kubeconfig per player (RBAC, quota, NetworkPolicy), the error matrix, the idle kick, the lease end removes node, namespace and token
    layer: tenancy
    user_facing: true
    releases: ["v0.2.0-poc"]
    learn:
      concept: "Multi-tenancy: one namespace per player with RBAC, Pod Security, quota and NetworkPolicy; outside it the answer is 403."
      analogy: "Every player gets a room with a lock: free to rearrange it, forbidden to open the others."
      real_world: "An internal platform where many teams share one cluster without seeing each other."
      seen_in: "v0.2.0-poc: the visitor runs a pod in its own namespace and gets 403 listing nodes."
    proven_by:
      - {suite: poc-pool, steps: [PL01-PL25]}
    paths: [poc/pool.py, poc/pool.yaml, poc/participant.py, poc/participant-policy.yaml, poc/admission.py]
    components: [admission, k3s, Kyverno]
    docs: [docs/ADMISSION.md, docs/JOIN.md]

  - id: party
    description: LAN party mode (issue #75) - two players who both agreed reach each other's namespace on the party's ports only; a third does not; leave, off, end, kick and lease end close it
    layer: tenancy
    user_facing: true
    releases: ["v0.3.0-poc"]
    learn:
      concept: "Mutual consent: a declarative NetworkPolicy opens only after both sides say yes, which is zero trust between tenants."
      analogy: "Two friends at a LAN party agree to plug a cable between their machines; either one can pull it."
      real_world: "Two teams or companies sharing one service for a limited time, with no ticket to the platform team."
      seen_in: "v0.3.0-poc: romero invites carmack, carmack accepts, and only then the Doom match starts."
    proven_by:
      - {suite: poc-party, steps: [PY01-PY17]}
    paths: [poc/party.py, poc/test_party.py, poc/poc-party.sh]
    components: [k3s, NetworkPolicy, admission]
    docs: [docs/DESIGN.md, docs/ADMISSION.md, docs/JOIN.md]

  - id: doom
    description: the Doom deathmatch over parties (issue #75 part B) - romero's Odamex server with FreeDM and the robots of carmack and petersen play through two parties on 10666/UDP; the server log is the witness; no consent, after leave, or a third player with another's party connects nothing; the image has nothing non-free
    layer: tenancy
    user_facing: true
    releases: ["v0.3.0-poc", "v0.3.1-poc"]
    learn:
      concept: "Pairwise, non-transitive access: a party between A and B, and another between A and C, opens nothing between B and C."
      analogy: "romero hosts the server; carmack and petersen each cable into his machine, never into each other's."
      real_world: "A shared service, such as a database or an inference endpoint, that each consumer reaches without reaching the other consumers."
      seen_in: "v0.3.0-poc: petersen cannot reach carmack although both play on romero's server."
    proven_by:
      - {suite: poc-doom, steps: [DM01-DM20]}
    paths: [poc/doom/*, poc/poc-doom.sh]
    components: [k3s, Cilium, NetworkPolicy, Odamex, FreeDM, ffmpeg]
    docs: [docs/DESIGN.md, docs/JOIN.md, docs/PUBLIC-PAGE.md]

  - id: public-page
    description: the public page (phase B2) on a server that holds no credential; a visitor asks, waits, collects a sealed bundle, joins, is expelled; panic closes it; What's new tells each release with recordings of real runs (make showcase)
    layer: admission
    user_facing: true
    releases: ["v0.2.0-poc", "v0.2.1-poc"]
    learn:
      concept: "A public front door that holds no credential: a visitor asks, waits and collects a sealed bundle from the host's own tick."
      analogy: "A reception desk that takes your name but has no keys; the envelope with the key comes from the back office."
      real_world: "Self-service onboarding for outside users or partners without giving the web tier any secret."
      seen_in: "v0.2.0-poc and v0.2.1-poc: the request page and this What's new page, served by a server with no credential."
    proven_by:
      - {suite: poc-page, steps: [G01-G26]}
    paths: [poc/page/*, poc/poc-page.sh]
    components: [page, Caddy, Nebula, admission]
    docs: [docs/PUBLIC-PAGE.md, docs/ADMISSION.md, CONTRIBUTING.md]

  - id: lighthouse-external
    description: a lighthouse on a separate public server, prepared, signed and deployed idempotently; its key never leaves it; players join through it
    layer: mesh
    user_facing: false
    proven_by:
      - {suite: poc-lighthouse, steps: [P01-P15]}
      - {suite: poc-page, steps: [G02]}
      - {suite: poc-nat, steps: [N02-N03]}
    paths: [poc/lighthouse-vps.sh, poc/mesh]
    components: [Nebula, lighthouse]
    docs: [docs/HOST-YOUR-OWN.md, docs/NETWORKING.md]

  - id: revoke
    description: one command revokes a player (blocklist on every host, the external lighthouse included, the Node deleted); idempotent, measured
    layer: mesh
    user_facing: true
    learn:
      concept: "Real revocation: access is cut at the mesh on every host, not only by deleting the Node object."
      analogy: "Banning a player at the server's door and at the lighthouse, not just crossing the name off the scoreboard."
      real_world: "Cutting a contractor's or a lost laptop's access now, not when its credential would have expired."
      seen_in: "Deleting the Node alone leaves the machine in the mesh; one revoke command cuts it (poc-revoke R03 and R04)."
    proven_by:
      - {suite: poc-revoke, runtime: docker, steps: [R01-R10]}
      - {suite: poc-revoke, runtime: incus, steps: [R01-R10]}
      - {suite: poc-join, runtime: docker, steps: [J17]}
      - {suite: poc-join, runtime: incus, steps: [J17]}
      - {suite: poc-lighthouse, steps: [P16-P17]}
      - {suite: poc-nat, steps: [N25-N26]}
      - {suite: poc-golden, steps: [G5.1-G5.5]}
    paths: [poc/revoke.sh, poc/nodes_sweep.py, poc/lighthouse-vps.sh, poc/mesh]
    components: [Nebula, k3s, lighthouse]
    docs: [docs/HOST-YOUR-OWN.md, docs/GOLDEN-RULES.md]

  - id: two-level-ca
    description: a persistent CA and a pool CA constrained to group public; pulling the pool CA cuts only the pool
    layer: mesh
    user_facing: false
    proven_by:
      - {suite: poc-ca, runtime: docker, steps: [B01-B13]}
      - {suite: poc-ca, runtime: incus, steps: [B01-B13]}
      - {suite: poc-golden, steps: [G8.2, G9.1]}
    paths: [poc/issue.sh, poc/lib.sh]
    components: [Nebula, CA]
    docs: [docs/DESIGN.md, docs/HOST-YOUR-OWN.md]

  - id: placement
    description: golden rule 1 - trust-based placement with Kyverno; a private pod on someone else's node is rejected; shareable pods opt in
    layer: tenancy
    user_facing: true
    learn:
      concept: "Placement by trust: labels, taints and an admission policy decide which pods may run on which nodes."
      analogy: "Your diary stays in your own bag; only what you mark as shareable goes to a friend's table."
      real_world: "Sensitive workloads that never leave the on-prem nodes, while shareable ones use rented or partner capacity."
      seen_in: "A private pod pinned to someone else's node is rejected (poc-placement L20 to L24)."
    proven_by:
      - {suite: poc-placement, runtime: docker, steps: [L01-L45]}
      - {suite: poc-placement, runtime: incus, steps: [L01-L45]}
      - {suite: poc-golden, steps: [G2.1-G2.7]}
    paths: [poc/placement/*, poc/install-placement.sh, poc/vm/poc-placement.sh]
    components: [Kyverno, k3s]
    docs: [docs/GOLDEN-RULES.md, docs/HOST-YOUR-OWN.md]
    diagrams: [docs/diagrams/placement-kyverno.mmd]

  - id: trust-freeze
    description: a node cannot raise or change its own trust label or drop its taint; only the host can
    layer: tenancy
    user_facing: false
    proven_by:
      - {suite: poc-placement, runtime: docker, steps: [L50-L53]}
      - {suite: poc-placement, runtime: incus, steps: [L50-L53]}
      - {suite: poc-bgp, steps: [G09-G09b]}
      - {suite: poc-golden, steps: [G7.2]}
    paths: [poc/node-trust-freeze.yaml, poc/placement/node-trust-vap.yaml]
    components: [k3s, admission policy]
    docs: [docs/GOLDEN-RULES.md, docs/DESIGN.md]

  - id: golden-rules
    description: one check per golden rule against a running game (issue #23); rule 1 is said at join time and in the docs
    layer: tenancy
    user_facing: false
    proven_by:
      - {suite: poc-golden, steps: [G1.1-G2.7, G3.1-G10.1]}
    paths: [poc/poc-golden.sh, poc/golden.py, docs/GOLDEN-RULES.md]
    components: [golden suite]
    docs: [docs/GOLDEN-RULES.md, docs/POC-STATUS.md]

  - id: encrypted-pod-network
    description: Cilium in tunnel mode with WireGuard over Nebula; pod to pod, DNS, the clear text never on the Nebula interface, 30 MB intact
    layer: podnet
    user_facing: false
    learn:
      concept: "Encryption in transit between pods: Cilium with WireGuard on top of the Nebula mesh, so pod traffic is never in clear text on the mesh interface."
      analogy: "Passing notes in a code, inside a tunnel the others cannot see into."
      real_world: "Pod traffic that crosses sites, clouds or networks you do not own."
      seen_in: "poc-cilium: pod to pod and DNS work, and a 30 MB transfer arrives intact."
    proven_by:
      - {suite: poc-cilium, steps: [C01-C09, C12, C13b]}
      - {suite: poc-vm, steps: [V03-V06b, V07-V09, V10, V13-V13b]}
      - {suite: poc-golden, steps: [G3.1-G3.3]}

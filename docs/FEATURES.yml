  - id: cilium-guard
    description: issue #53 - the Cilium agent token on a remote node cannot forge another node's endpoints, WireGuard key or identities
    layer: podnet
    user_facing: false
    releases: ["v0.2.0-poc"]
    learn:
      concept: "Least privilege for a node's own credentials: a node agent's token must not be able to forge another node's identity."
      analogy: "A player's badge opens his own seat; it cannot rewrite the seating chart."
      real_world: "Edge or rented nodes you do not fully control, where each agent's token is scoped to what that agent needs."
      seen_in: "v0.2.0-poc: the Cilium agent's token can no longer forge another node's endpoints, WireGuard key or identities."
    proven_by:
      - {suite: poc-vm, steps: [V06c, V09b-V09c]}
      - {suite: poc-golden, steps: [G3.5]}
    paths: [poc/cilium-node-guard.yaml, poc/cilium.sh]
    components: [Cilium, admission policy]
    docs: [docs/DESIGN.md, docs/TROUBLESHOOTING.md]

  - id: spire-scope
    description: issue #54 - the SPIRE agent token on a joined node may only get nodes/pods; nodes/proxy, pods and nodes are refused
    layer: podnet
    user_facing: false
    releases: ["v0.2.0-poc"]
    learn:
      concept: "Scoped RBAC for a node agent: the SPIRE agent's token may get nodes and pods and nothing more."
      analogy: "The doorman may check the guest list, but he gets no key to the offices."
      real_world: "Any agent that runs on a node you do not fully trust: give it the exact verbs it needs, and nothing cluster-wide."
      seen_in: "v0.2.0-poc: the SPIRE agent's token may get nodes and pods, and nodes/proxy is refused (poc-vm V103)."
    proven_by:
      - {suite: poc-vm, steps: [V103]}
      - {suite: poc-golden, steps: [G3.6]}
    paths: [poc/spire-agent-rbac.yaml, poc/spire-args.sh]
    components: [SPIRE]
    docs: [docs/DESIGN.md, docs/TROUBLESHOOTING.md]


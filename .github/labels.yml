# The repo's labels, as code: the single source. Edit this file in a PR; the "Sync labels" workflow
# applies it (renames through `aliases` keep the issues). `make labels-check` (scripts/check_labels.py)
# fails when a form, the labeler, a workflow or check_pr.py names a label that is not here.
# Format: EndBug/label-sync (name, color, description <= 100 chars, aliases). Rules: CONTRIBUTING -> Labels.
# Labels that CI sets (scope:*, type:* by path) are never set by hand.
- name: "type:bug"
  color: "1d76db"
  description: "Something is broken"
  aliases: ["bug"]
- name: "type:feature"
  color: "1d76db"
  description: "New capability or improvement"
  aliases: ["enhancement"]
- name: "type:docs"
  color: "1d76db"
  description: "Documentation only"
  aliases: ["documentation"]
- name: "type:code"
  color: "1d76db"
  description: "scripts/, tests/, deploy/"
- name: "type:ci"
  color: "1d76db"
  description: "CI: .github/ and checks"
- name: "type:question"
  color: "1d76db"
  description: "Support question: answer, then close or move to Discussions"
  aliases: ["question"]
- name: "type:rfc"
  color: "1d76db"
  description: "Proposal that changes how the project works"
- name: "area:network"
  color: "bfdadc"
  description: "Overlay network: Nebula, lighthouse, CA, certificates"
- name: "area:control-plane"
  color: "bfdadc"
  description: "k3s, join flow, bootstrap tokens, CNI"
- name: "area:identity"
  color: "bfdadc"
  description: "Login for people: OIDC, RBAC"
- name: "area:security"
  color: "bfdadc"
  description: "Threat model, admission policy, revocation"
- name: "area:lab"
  color: "bfdadc"
  description: "The free local lab (kind/k3d in WSL) and its tests"
- name: "priority:high"
  color: "b60205"
  description: "Broken main, security, data loss, blocks the next release"
- name: "priority:medium"
  color: "d93f0b"
  description: "Planned for the next release"
- name: "priority:low"
  color: "0e8a16"
  description: "Backlog; welcome from contributors"
- name: "severity:high"
  color: "b60205"
  description: "Severity of a review finding (only with from-review)"
- name: "severity:medium"
  color: "d93f0b"
  description: "Severity of a review finding (only with from-review)"
- name: "severity:low"
  color: "fef2c0"
  description: "Severity of a review finding (only with from-review)"
- name: "from-review"
  color: "fbca04"
  description: "Follow-up found by a code review"
- name: "scope:small"
  color: "5319e7"
  description: "Change scope declared in the PR (see CONTRIBUTING)"
- name: "scope:medium"
  color: "5319e7"
  description: "Change scope declared in the PR (see CONTRIBUTING)"
- name: "scope:large"
  color: "5319e7"
  description: "Change scope declared in the PR (see CONTRIBUTING)"
- name: "scope:security"
  color: "5319e7"
  description: "Touches the security design, the threat model or the join flow"
- name: "size-exception"
  color: "fbca04"
  description: "Maintainer waiver: more than 400 changed lines of code (CONTRIBUTING)"
- name: "triage:needed"
  color: "bfd4f2"
  description: "Not looked at by a maintainer yet"
- name: "triage:needs-info"
  color: "fbca04"
  description: "Waiting for the author (14 days)"
  aliases: ["needs-info"]
- name: "status:blocked"
  color: "6a737d"
  description: "Waiting on something external; link it in a comment"
- name: "lifecycle:stale"
  color: "ededed"
  description: "No activity; will close unless someone answers"
- name: "lifecycle:frozen"
  color: "0075ca"
  description: "Never marked stale"
- name: "good first issue"
  color: "7057ff"
  description: "Small, explained, tests ready; a maintainer will mentor"
- name: "help wanted"
  color: "008672"
  description: "Agreed work where outside help is welcome"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked (link it)"

name: Proposal (RFC)
description: Change how the project works - the trust model, the join flow, a core dependency, a rule, the licence
title: "RFC: "
labels: ["type:rfc", "triage:needed"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals get 14 days of comments, then the maintainer decides. Day-to-day fixes do not need one: open a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does not work today, and for whom?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations: {required: true}
  - type: textarea
    id: threat
    attributes:
      label: Threat model impact
      description: What can a malicious node, a stolen token or a stolen certificate do after this change that it could not before?
    validations: {required: true}
  - type: textarea
    id: check
    attributes:
      label: How it will be checked
      description: A principle without a check is a wish. Which test, validator or CI job will enforce it?
    validations: {required: true}

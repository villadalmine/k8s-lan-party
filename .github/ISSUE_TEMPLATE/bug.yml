name: Bug
description: Something in the repository (a script, a check, a workflow, a doc) misbehaves
labels: ["type:bug", "triage:needed"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands from a fresh clone if you can.
      render: shell
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04 (WSL2), Docker 29, kind 0.30 / bare-metal / a VM"

name: Verify

# Adapted from study-cybercirujas (verify.yml). The ruleset in .github/rulesets/main.json requires two
# checks by name: `verify` (here: labels as code, unit tests of the gates, no secrets) and `pr-format`
# (the PR description, in pr-format.yml), plus where-it-ran here, a comment with the line to paste
# under "Evidence -> Where it ran".
#
# Only code events trigger this workflow (issue #60, review of #61): a description edit or a label
# never runs it, so it never creates a skipped `verify` check run on a head. GitHub counts `skipped`
# as passing and the ruleset takes the newest check run of each name, so a skipped `verify` would hide
# a red one. Every `verify` check run on a head is a real run on that exact commit.
# tests/test_check_pr.py (test_verify_never_skips_by_event) keeps it that way.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels the older run: that run is on the old head, so its cancelled
  # checks never land on the new head. A push to main gets its own group (sha) and is never cancelled:
  # every commit on main keeps its own verify result.
  group: verify-${{ github.event_name == 'push' && format('main-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # No `if:`: this job must never be skipped on a pull_request (see the header).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q --require-hashes -r .github/requirements-ci.txt
      - name: Verify
        run: make verify-ci
      - name: Secrets
        run: |
          # Key-shaped strings are refused (same shapes as scripts/pr_check.py).
          if git grep -nE '\b(sk-[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!.github/workflows/verify.yml' ':!scripts/pr_check.py'; then
            echo "::error::key-shaped string in the tree"; exit 1
          fi

  authors:
    # On main: every commit authored or committed by the repository owner carries a noreply address. A squash
    # merge from the API uses the merging account's email, so the owner's account must keep its email private
    # (runbook docs/runbooks/github-proteger-main.md, precondition and Step 3). A contributor's own address is
    # theirs to choose and is not checked. Only domains are printed, never an address.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          range="$BEFORE...$AFTER"; [ -z "${BEFORE//0/}" ] && range="$AFTER~1...$AFTER"
          # fail closed: if the commits cannot be read, the job fails (no "OK" on an error)
          bad="$(gh api "repos/$REPO/compare/$range" --jq '.commits[]
            | select(.author.login == env.OWNER or .committer.login == env.OWNER)
            | select([.commit.author.email, .commit.committer.email]
                     | all(endswith("@users.noreply.github.com") or . == "noreply@github.com") | not)
            | "\(.sha[0:7]) author @\(.commit.author.email | split("@")[1]) committer @\(.commit.committer.email | split("@")[1])"')"             || { echo "::error::could not read the commits of $range"; exit 1; }
          if [ -n "$bad" ]; then
            echo "::error::commits of the owner on main without a noreply address (keep the account's email private):"
            echo "$bad"; exit 1
          fi
          echo "authors OK ($range)"

  where-it-ran:
    # After verify passes on a new head, post (or update) one comment with the exact line for the
    # description's "Where it ran" subsection. Our own Actions token, no external bot.
    if: github.event_name == 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true      # a fork's token cannot comment; the check still works
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- where-it-ran -->'
          body="$marker
          **Where it ran** - paste this into the description, under *Evidence -> Where it ran*:

          \`\`\`
          - CI: https://github.com/$REPO/actions/runs/$RUN - verify green on head \`${SHA:0:7}\`
          \`\`\`"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi

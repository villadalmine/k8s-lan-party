name: Participants

# Join by signed pull request (docs/DESIGN.md section 5.1, participants/README.md, issue #12). Three jobs:
#   participants          the participant files this PR adds, changes or deletes, against the PUBLIC Sigstore (Fulcio + Rekor): the
#                         signer is the workflow .github/workflows/sign.yml in the fork of the file's login, with that login's account id,
#                         and the PR author is that login; schema, unique node name, trust ceiling of participants/policy.yaml on the BASE
#                         branch. Always reports (a PR without participant files passes). Not a required check until it has
#                         verified one real participant's file (issue #12).
#   participants-live     the live verification code against the public Sigstore, on a blob this run signs keyless itself.
#   participants-offline  the code itself: make poc-participants, the same verification against a LOCAL TEST CA (no network after the
#                         pinned tools are fetched), the issuing, the encrypted delivery and the revocation.
# Nothing here holds or needs a secret: the Nebula CA and the issuer's key stay on the maintainer's host (participants.py sync).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: participants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  participants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -q pyyaml==6.0.3 cryptography==50.0.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - name: Check the participant files
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The checker that judges a PR is the one already on the base branch: a PR cannot loosen its own check by editing
          # participants.py (the first PR, which adds it, has none there and runs its own).
          if git cat-file -e "origin/$BASE_REF:poc/participants.py" 2>/dev/null; then
            git show "origin/$BASE_REF:poc/participants.py" >"$RUNNER_TEMP/participants.py"
          else
            cp poc/participants.py "$RUNNER_TEMP/participants.py"
          fi
          python3 "$RUNNER_TEMP/participants.py" check --repo . --base "origin/$BASE_REF" --head HEAD \
            --author "$AUTHOR" --author-id "$AUTHOR_ID"

  participants-live:
    # The live verification path against the public Sigstore, exercised on every same-repository PR without a second account:
    # this job signs a throw-away blob keyless and runs the check's own verification code on it (poc/participants-live-smoke.sh).
    # A fork's PR gets no OIDC token, so the job runs only for branches of this repository. Its signature is a public Rekor entry
    # naming this workflow (the repository is public; nothing else is in it).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # the OIDC token Fulcio turns into the signing certificate of this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -q pyyaml==6.0.3 cryptography==50.0.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - name: Sign keyless and verify with the check's code
        run: bash poc/participants-live-smoke.sh

  participants-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -q pyyaml==6.0.3 cryptography==50.0.2
      - name: make poc-participants
        run: make poc-participants

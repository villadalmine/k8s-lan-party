# The participant guard: what a player may not do inside their own namespace (play-<name>, labelled edge-mesh/participant=<name>), on
# top of Pod Security "restricted", the ResourceQuota, the NetworkPolicy and the Role (poc/participant.py). Applied by `mesh host invite`;
# idempotent.
#  - golden rule 2 for players: a pod that is not labelled edge-mesh/sensitivity=shareable is private (the default), and a private pod
#    runs only on the player's own node. The MutatingAdmissionPolicy pins it there (nodeSelector kubernetes.io/hostname=<name>) when it
#    names no host; the validation refuses any private pod pinned elsewhere (a nodeSelector naming another player's node). "Own" is
#    relative to the player here: the absolute `trust=own` of poc/placement/ is the host's, and skips these namespaces.
#  - a shareable pod (its owner opted in: golden rule 1, what runs on someone else's machine can be seen by its owner) may run on any
#    player's node, also one it names; never on the host's control plane (below);
#  - a Service is ClusterIP only and has no externalIPs: an externalIP lets a namespace user take over traffic to any address in the
#    cluster (CVE-2020-8554), and a NodePort or LoadBalancer would open a port on other people's machines;
#  - a pod may not name its node (spec.nodeName skips the scheduler and every taint) nor tolerate the control plane's taint: a
#    player's pods never land on the host's control plane. The scheduler binds pods through pods/binding, which this does not match.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: edge-mesh-participant-private
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: edge-mesh/participant, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: private
      expression: >-
        !has(object.metadata.labels) || !('edge-mesh/sensitivity' in object.metadata.labels) ||
        object.metadata.labels['edge-mesh/sensitivity'] != 'shareable'
    - name: names-no-host
      expression: "!has(object.spec.nodeSelector) || !('kubernetes.io/hostname' in object.spec.nodeSelector)"
  mutations:
    # a JSON patch: nodeSelector is an atomic map, which an apply configuration may not merge into
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.nodeSelector) ?
          [JSONPatch{op: "add", path: "/spec/nodeSelector/kubernetes.io~1hostname",
                     value: namespaceObject.metadata.labels["edge-mesh/participant"]}] :
          [JSONPatch{op: "add", path: "/spec/nodeSelector",
                     value: {"kubernetes.io/hostname": namespaceObject.metadata.labels["edge-mesh/participant"]}}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: edge-mesh-participant-private
spec:
  policyName: edge-mesh-participant-private
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edge-mesh-participant-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: edge-mesh/participant, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services", "pods"]
  validations:
    - expression: "request.resource.resource != 'services' || !has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "a participant's Service must be ClusterIP: no NodePort, LoadBalancer or ExternalName (edge-mesh participant guard)"
    - expression: "request.resource.resource != 'services' || !has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "a participant's Service may not set externalIPs (edge-mesh participant guard)"
    # CREATE only: once scheduled every pod has a nodeName, and an update cannot change it (nor the nodeSelector)
    - expression: >-
        request.resource.resource != 'pods' || request.operation != 'CREATE' || !has(object.spec.nodeName) || object.spec.nodeName == ''
      message: "a participant's pod may not set spec.nodeName: the scheduler places it (edge-mesh participant guard)"
    - expression: >-
        request.resource.resource != 'pods' || request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'edge-mesh/sensitivity' in object.metadata.labels &&
         object.metadata.labels['edge-mesh/sensitivity'] == 'shareable') ||
        (has(object.spec.nodeSelector) && 'kubernetes.io/hostname' in object.spec.nodeSelector &&
         object.spec.nodeSelector['kubernetes.io/hostname'] == namespaceObject.metadata.labels['edge-mesh/participant'])
      message: >-
        a private pod (not labelled edge-mesh/sensitivity=shareable) runs only on your own node: no nodeSelector naming another node
        (golden rule 2; edge-mesh participant guard)
    - expression: >-
        request.resource.resource != 'pods' || !has(object.spec.tolerations) || !object.spec.tolerations.exists(t,
        !has(t.key) || t.key == '' || t.key == 'node-role.kubernetes.io/control-plane')
      message: "a participant's pod may not tolerate the control plane's taint or every taint (edge-mesh participant guard)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edge-mesh-participant-guard
spec:
  policyName: edge-mesh-participant-guard
  validationActions: [Deny]

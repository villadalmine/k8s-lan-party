! The test router: plays the maintainer's edge router (the real one is never touched by a test). It accepts a session only from the own
! node's address it lists; any other address that opens TCP 179 is refused ("not configured") and gets no session. Filled by poc/gateway.sh.
frr defaults traditional
log file /var/log/frr/bgpd.log debugging
debug bgp neighbor-events
router bgp @ROUTER_ASN@
 bgp router-id @ROUTER_IP@
 no bgp ebgp-requires-policy
 neighbor @OWN_IP@ remote-as @OWN_ASN@
 address-family ipv4 unicast
  neighbor @OWN_IP@ activate
 exit-address-family

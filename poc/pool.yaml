# Capacity pool of the public demo: the one file with the numbers (DESIGN.md section 8, docs/ADMISSION.md). Read by the manual
# admission (option A) and by the automatic tick (phase B1, `mesh host auto --once`): the same limits for both.
# The maintainer's rules (2026-10-27), as we read them; docs/ADMISSION.md "Parameters" says who decides each value:
#   two places at a time, one hour each; whoever comes next waits in a FIFO list; when an hour ends the place is freed
#   and the next one in the list may enter; at most two leases a day per person, so it is not always the same one,
#   and a pause between two leases of the same person.
# "Person" = an identity: the client IP normalized (IPv4 address or its /24, IPv6 /64) or the name if there is no IP.
slots: 2                    # places at the same time (participant nodes); 0 = admission closed (the abuse switch)
                            # each place has one namespace, play-<name>, made at the invite and deleted with the lease (poc/participant.py)
lease_seconds: 3600         # 1 hour, hard: the certificate and the player's kubeconfig token expire then and `mesh host reap` expels at the end
cooldown_seconds: 3600      # an identity waits this long after its lease ends before the next one
daily_leases_per_identity: 2   # at most this many leases per identity in any 24 h (rolling window, not the calendar day)
identity_ipv4_prefix: 32    # 32 = one IPv4 address is one identity; 24 = a whole /24 (stricter, for the public opening)
identity_ipv6_prefix: 64    # an IPv6 /64 is one identity (one customer usually holds at least a /64)
identity_retention_seconds: 90000   # 25 h: an identity (an IP) is forgotten this long after its lease or request closed; never
                                    # less than the 24 h window or the cooldown (the code takes the larger). Names and times stay
rate_window_seconds: 600    # per-identity request rate limit: rate_max_requests per window (automatic pool, option B)
rate_max_requests: 5
lease_warning_seconds: 300  # the automatic tick records `expiring` once per lease when this little is left (5 min)
events_max_lines: 5000      # events.jsonl keeps at most this many lines (the counters of the metrics survive the rotation)
idle_kick_seconds: 900      # no node, NotReady or no workload for this long: the tick expels the lease early (0 = off)
trusted_proxies: [127.0.0.1, 172.31.0.1]   # only these may set X-Forwarded-For (Caddy)
# Per player namespace (ResourceQuota and LimitRange of play-<name>; no LoadBalancer, no NodePort, no volume claim):
quota_pods: 10
quota_cpu_millis: 1000      # requests and limits of all the player's pods together
quota_memory_mib: 1024
quota_storage_mib: 2048     # ephemeral storage (emptyDir, container layers) of all the player's pods: it fills somebody's disk
quota_services: 5           # ClusterIP only (the participant guard, poc/participant-policy.yaml)
quota_configmaps: 10        # object counts: etcd is the host's
quota_deployments: 5
limit_default_cpu_millis: 200   # a container that sets no limit gets this one, and half of it as its request
limit_default_memory_mib: 128
limit_default_storage_mib: 256
limit_max_cpu_millis: 500       # the most one container may ask for
limit_max_memory_mib: 512
limit_max_storage_mib: 1024
